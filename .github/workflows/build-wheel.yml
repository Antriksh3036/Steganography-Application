name: Build Linux Wheel

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "pyproject.toml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          command: build
          args: --release --interpreter python3.11 --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheel
          path: dist/*.whl
